{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`){{ if .Values.ingressRoute.path }} && PathPrefix(`{{ .Values.ingressRoute.path }}`){{ end }}
      services:
        - name: {{ include "helm-chart.fullname" . }}
          port: 80
          {{- with .Values.ingressRoute.scheme }}
          scheme: {{ . }}
          {{- end }}
          {{- if and (eq .Values.ingressRoute.scheme "https") .Values.ingressRoute.insecureSkipVerify }}
          serversTransport: {{ include "helm-chart.fullname" . }}-insecure
          {{- end }}
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
