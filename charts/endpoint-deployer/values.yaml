fullnameOverride: endpoint-deployer

service:
  port: 80

endpoint:
  ip: "192.168.178.100"

ingress:
  enabled: false
  host: service.csnguyen.de
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: |
      kube-system-redirect-https@kubernetescrd
  path: /
  pathType: Prefix
  tlsSecret: csnguyen-tls

# Alternative to ingress: Traefik's native IngressRoute CRD.
# Requires the Traefik CRDs to be installed in the cluster.
ingressRoute:
  enabled: false
  host: service.csnguyen.de
  path: /
  entryPoints:
    - websecure
  middlewares:
    - name: redirect-https
      namespace: kube-system
  tls:
    secretName: csnguyen-tls
  # Set to "https" for backends that only speak TLS (e.g. self-signed admin UIs).
  scheme: ""
  # Only used when scheme is "https": skip TLS verification of the backend's
  # (likely self-signed) certificate via a generated ServersTransport.
  insecureSkipVerify: false
